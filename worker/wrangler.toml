name = "vfs-alert-pk"
main = "worker/src/index.ts"
compatibility_date = "2025-09-25"
compatibility_flags = ["nodejs_compat"]

# Browser Rendering for Playwright
browser = { binding = "MYBROWSER" }

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "vfs-alert-db"
database_id = "ae958542-cc08-425e-a29f-c3dd4d40925e"

# KV Namespace for slot state
[[kv_namespaces]]
binding = "SLOT_STATE"
id = "3dc020ab2bcc4c5c8395b2a5a34fb0b7"

# Cron: every 1 minute
[triggers]
crons = ["* * * * *"]

# Environment variables (non-secret)
[vars]
ENVIRONMENT = "production"
